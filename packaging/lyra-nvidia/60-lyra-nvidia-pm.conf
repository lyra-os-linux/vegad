# Lyra NVIDIA: runtime D3 (RTD3) power management.
# The driver default (0x03) disables RTD3 on pre-Ampere notebook GPUs, keeping
# a Turing dGPU such as the GTX 1650 Mobile powered on at idle. 0x02
# (fine-grained) lets the GPU power off when no work is running. Desktop GPUs
# without platform RTD3 support ignore it.
# Override with a file of the same name in /etc/modprobe.d.
options nvidia NVreg_DynamicPowerManagement=0x02
