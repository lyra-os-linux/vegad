# Perfil de execução do vegad: desktop ou server.
#
# Sem valor aqui (e sem VEGAD_PROFILE no ambiente do serviço), o vegad detecta
# a edição instalada: o marcador /usr/lib/lyra-os/server-release do Lyra OS
# Server seleciona "server"; qualquer outra instalação usa "desktop". Para
# fixar o perfil, copie um modelo de /usr/share/vega/profiles/ para este
# arquivo e reinicie vegad.service.
#VEGAD_PROFILE=desktop
