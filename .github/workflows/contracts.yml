name: Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: vegad
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: vegad/go.mod
          cache-dependency-path: vegad/go.sum
      - name: Test and lint
        working-directory: vegad
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

  system-contracts:
    runs-on: ubuntu-latest
    container:
      image: registry.opensuse.org/opensuse/leap:16.0
      env:
        # The image has no PATH in its OCI config. Preserve system tools when
        # setup-go/rust-toolchain prepend their own directories for later steps.
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Install build tools and contract validators on the supported distro
        run: >-
          zypper --non-interactive install --no-recommends
          bash ca-certificates curl git tar gzip xz gcc make gettext-tools
          libxml2-tools rpm dbus-1-daemon systemd util-linux
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: vegad
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lyra-os-linux/lyra-vega-dbus
          path: lyra-vega-dbus
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: vegad/go.mod
          cache-dependency-path: vegad/go.sum
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.92"
      - name: Stage daemon executable for systemd unit validation
        working-directory: vegad
        run: |
          go build -o /tmp/vegad-contract-check ./cmd/vegad
          install -Dm755 /tmp/vegad-contract-check /usr/lib/vega/vegad
      - name: Validate packaging contracts
        run: ./vegad/scripts/check-packaging-contracts.sh
      - name: Validate the running daemon against canonical D-Bus XML
        run: ./vegad/scripts/test-dbus-integration.sh
